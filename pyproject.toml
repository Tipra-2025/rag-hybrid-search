[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rag-hybrid-search"
version = "0.1.0"
description = "Production-grade RAG with multi-format ingestion, three swappable chunking strategies, hybrid (dense + BM25) retrieval with RRF fusion, cross-encoder reranking, grounded generation with bracketed citations, and LLM-as-judge citation verification."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "metehanulusoy", email = "metehanulusoy@users.noreply.github.com" }]
keywords = [
    "rag", "retrieval-augmented-generation", "hybrid-search", "bm25",
    "embeddings", "openai", "fastapi", "rrf-fusion", "cross-encoder",
    "citation-verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "structlog>=24.1",
    "click>=8.1",
    "tenacity>=8.2",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "pandas>=2.2"]
reranker = ["sentence-transformers>=2.7"]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
rag = "rag.cli:main"

[project.urls]
Homepage = "https://github.com/metehanulusoy/rag-hybrid-search"
Issues = "https://github.com/metehanulusoy/rag-hybrid-search/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:pypdf.*",
    "ignore::SyntaxWarning",
    # pytest-asyncio + httpx GC race: a test event loop occasionally lands in
    # the unraisable hook *after* the test passes. We catch the warning so it
    # doesn't poison the next test.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["rag"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "tiktoken.*", "pypdf.*", "bs4.*", "streamlit.*", "pandas.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]
